name: Build deep-harness-switch (.nro)

# 本地没有 devkitPro 时的编译验证通道:
# 推到 GitHub 后自动用 devkitpro/devkita64 镜像交叉编译并产出 .nro;
# 打 v* 标签时额外发布 GitHub Release(附 .nro 可直接装 SD 卡)。
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch libraries (portlibs)
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 switch-sdl2_ttf \
            switch-freetype switch-harfbuzz \
            switch-zlib switch-libpng switch-bzip2

      - name: Build
        run: make -j$(nproc)

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: deep-harness-switch
          path: deep-harness-switch.nro

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .nro artifact
        uses: actions/download-artifact@v4
        with:
          name: deep-harness-switch
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deep-harness-switch.nro
          body: "Nintendo Switch 自制程序:右 Joy-Con 红外摄像头基准/探针(Phase 1)。测量各 IrsImageTransferProcessorFormat 的采集时序。将 .nro 放入 SD 卡 homebrew 目录运行。"
